<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g class="art-ink" filter="url(#ink-wobble)">
    <circle cx="100" cy="100" r="94" class="art-line-bold"/>
    <circle cx="100" cy="100" r="88" class="art-line-thin"/>
    <circle cx="100" cy="100" r="83.5" class="art-line-thin" stroke-dasharray="1.5 4.2"/>
    <!-- Квадрат и треугольник, вписанные в круг -->
    <rect x="47" y="47" width="106" height="106" class="art-line"/>
    <path d="M100 47 L153 153 L47 153 Z" class="art-line"/>
    <circle cx="100" cy="120" r="32" class="art-line"/>
    <!-- Солнце-золото в центре -->
    <circle cx="100" cy="120" r="11" class="art-gold"/>
    <circle cx="100" cy="120" r="2.6" class="art-ink-fill"/>
    <!--
      Символы четырёх стихий: огонь, воздух, вода, земля.
      Каждый стоит посередине между стороной квадрата и пунктирным кругом.
    -->
    <g class="art-line">
      <path d="M100 26.1 L106.5 37.4 L93.5 37.4 Z"/>
      <path d="M168.25 94.35 L174.75 105.65 L161.75 105.65 Z M159.75 100.6 H176.75"/>
      <path d="M93.5 162.6 L106.5 162.6 L100 173.9 Z"/>
      <path d="M25.25 94.35 L38.25 94.35 L31.75 105.65 Z M23.25 99.4 H40.25"/>
    </g>
    <!-- Заклёпки в поясе между внешними кольцами -->
    <g class="art-ink-fill">
      <circle cx="100" cy="9" r="1.5"/>
      <circle cx="191" cy="100" r="1.5"/>
      <circle cx="100" cy="191" r="1.5"/>
      <circle cx="9" cy="100" r="1.5"/>
      <circle cx="164.35" cy="35.65" r="1.1"/>
      <circle cx="164.35" cy="164.35" r="1.1"/>
      <circle cx="35.65" cy="164.35" r="1.1"/>
      <circle cx="35.65" cy="35.65" r="1.1"/>
    </g>
  </g>
</svg>
